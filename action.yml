name: 'agentsmd check'
description: >
  Validate AGENTS.md / CLAUDE.md in CI: fail the build when agent
  instructions reference commands or files that do not exist, or when
  tool bridges (CLAUDE.md → AGENTS.md) are stale.
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  path:
    description: 'Repository path to check'
    required: false
    default: '.'
  strict:
    description: 'Treat warnings as failures'
    required: false
    default: 'false'
  sync-check:
    description: 'Also verify CLAUDE.md/GEMINI.md bridges are up to date'
    required: false
    default: 'true'
  version:
    description: 'agentsmd version to install'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        resolve_latest() {
          local latest_url
          latest_url="$(curl -fsSL -o /dev/null -w '%{url_effective}' \
            https://github.com/youwei792/agentsmd/releases/latest)"
          printf '%s\n' "${latest_url##*/}"
        }
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          ACTION_REF="${{ github.action_ref }}"
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            VERSION="$ACTION_REF"
          else
            VERSION="$(resolve_latest)"
          fi
        fi
        [[ "$VERSION" == v* ]] || VERSION="v$VERSION"
        if [[ "$VERSION" =~ ^v[0-9]+$ ]]; then
          VERSION="$(resolve_latest)"
        fi
        case "${{ runner.os }}" in
          Linux) OS="linux" ;;
          macOS) OS="darwin" ;;
          Windows) OS="windows" ;;
          *) echo "unsupported runner OS: ${{ runner.os }}" >&2; exit 1 ;;
        esac
        ARCH="${{ runner.arch }}"
        case "$ARCH" in
          X64) ARCH="amd64" ;;
          ARM64) ARCH="arm64" ;;
          *) echo "unsupported runner architecture: $ARCH" >&2; exit 1 ;;
        esac
        TARBALL="agentsmd_${OS}_${ARCH}.tar.gz"
        URL="https://github.com/youwei792/agentsmd/releases/download/${VERSION}/${TARBALL}"
        echo "Installing agentsmd from $URL"
        INSTALL_DIR="$(mktemp -d)"
        trap 'rm -rf "$INSTALL_DIR"' EXIT
        curl -fsSL -o "$INSTALL_DIR/$TARBALL" "$URL"
        curl -fsSL -o "$INSTALL_DIR/checksums.txt" \
          "https://github.com/youwei792/agentsmd/releases/download/${VERSION}/checksums.txt"
        # Verify the tarball checksum before extracting/running anything.
        LINE="$(grep "  ${TARBALL}\$" "$INSTALL_DIR/checksums.txt")"
        if [ -z "$LINE" ]; then echo "checksums.txt has no entry for ${TARBALL}" >&2; exit 1; fi
        cd "$INSTALL_DIR"
        if command -v sha256sum >/dev/null 2>&1; then
          echo "$LINE" | sha256sum -c - >/dev/null
        else
          echo "$LINE" | shasum -a 256 -c - >/dev/null
        fi
        tar -xzf "$TARBALL"
        EXT=""
        [ "$OS" = "windows" ] && EXT=".exe"
        BIN="$INSTALL_DIR/agentsmd_${OS}_${ARCH}/agentsmd${EXT}"
        if [ ! -f "$BIN" ]; then echo "release archive does not contain $BIN" >&2; exit 1; fi
        BIN_DIR="$RUNNER_TEMP/agentsmd-bin"
        mkdir -p "$BIN_DIR"
        cp "$BIN" "$BIN_DIR/agentsmd${EXT}"
        [ "$OS" = "windows" ] || chmod +x "$BIN_DIR/agentsmd"
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        "$BIN_DIR/agentsmd${EXT}" version
    - shell: bash
      env:
        CHECK_PATH: ${{ inputs.path }}
        STRICT: ${{ inputs.strict }}
      run: |
        args=(check "$CHECK_PATH")
        [ "$STRICT" = "true" ] && args+=(--strict)
        agentsmd "${args[@]}"
    - shell: bash
      if: ${{ inputs.sync-check == 'true' }}
      env:
        CHECK_PATH: ${{ inputs.path }}
      run: agentsmd sync --check "$CHECK_PATH"
