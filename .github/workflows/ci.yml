name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Composite Action smoke test
        uses: ./
        with:
          version: v0.2.1

  dogfood:
    name: agentsmd on itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go build -o agentsmd .
      - name: doctor (informational)
        run: ./agentsmd doctor . || true
      - name: check (must pass)
        run: ./agentsmd check .

  release:
    name: Release
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = "windows" ] && ext=".exe"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X github.com/youwei792/agentsmd/internal/cli.version=${VERSION#v}" -o "dist/agentsmd_${os}_${arch}/agentsmd${ext}" .
            done
          done
          cd dist
          for d in agentsmd_*/; do
            name="${d%/}"
            tar -czf "${name}.tar.gz" "$name"
          done
          sha256sum agentsmd_*.tar.gz > checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt

  publish-npm:
    name: Publish npm distribution
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Assemble and publish platform packages, then main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not configured; skipping npm publish."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/build-npm.sh "$VERSION"
          for name in agentsmd-darwin-arm64 agentsmd-darwin-amd64 \
                      agentsmd-linux-arm64 agentsmd-linux-amd64 \
                      agentsmd-windows-amd64 agentsmd-windows-arm64; do
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} already published; skipping"
            else
              npm publish "npm/dist/$name" --access public --provenance
            fi
          done
          if npm view "@momo792/agentsmd@${VERSION}" version >/dev/null 2>&1; then
            echo "@momo792/agentsmd@${VERSION} already published; skipping"
          else
            npm publish npm/dist/agentsmd --access public --provenance
          fi
